# The verifier for this task. CMoA runs
#   docker compose -f compose.yaml -p <unique> run --rm --no-deps -T verify
# with CMOA_CANDIDATE_DIR pointing at the candidate worktree.
#
# This task is about a data race, so the verifier runs the race detector.
# The race detector needs cgo, hence CGO_ENABLED: "1".
services:
  verify:
    image: golang:1.27
    working_dir: /work
    volumes:
      - ${CMOA_CANDIDATE_DIR:?set by cmoa select}:/work
      - gomodcache:/go/pkg/mod
    environment:
      GOTOOLCHAIN: local
      # The candidate is a git worktree, whose .git is a file pointing at a
      # host path; -buildvcs=false keeps go from looking at it.
      GOFLAGS: -mod=mod -buildvcs=false
      CGO_ENABLED: "1"
    command: ["go", "test", "-race", "./..."]
volumes:
  gomodcache:
