# Generated by `uzushio docdag-config` from internal/vault; do not edit by hand.
# Source: github.com/Kaikei-e/uzushio internal/vault (DocDag v0.4.0 spec preset + uzushio kinds).
preset: spec
preset_version: 2
kinds:
  calibration:
    dir: spec/calibrations
    id: "^calibration/[a-z0-9.]+(-[a-z0-9.]+)*@\\d{4}-\\d{2}-\\d{2}(-\\d+)?$"
    closed: true
    append_only: true
    fields:
      human_kappa: {}
      in_force_until: {}
      judge:
        required: true
      n_human: {}
      n_items: {}
      pool:
        required: true
      report: {}
      rerun_kappa: {}
      swap_kappa: {}
      tie_handling:
        one_of:
        - abstain-as-category
        - decided-only
        required: true
      verdict:
        one_of:
        - calibrated
        - uncalibrated
        - unmeasured
        required: true
      window_from: {}
      window_to: {}
    period:
      from: date
      until: in_force_until
  clause:
    dir: spec/clauses
    id: "^UZ-[A-Z]-\\d{3}$"
    status_values:
    - proposed
    - trial
    - accepted
    - superseded
    - withdrawn
    closed: true
    fields:
      in_force_from: {}
      in_force_until: {}
      modality:
        one_of:
        - MUST
        - MUST_NOT
        - SHOULD
        - SHOULD_NOT
        - MAY
        required: true
    period:
      from: in_force_from
      until: in_force_until
  conform:
    dir: spec/conform
    id: ^conform/[a-z0-9-]+$
    append_only: true
    fields:
      test: {}
  deviation:
    dir: spec/deviations
    id: "^dev-\\d{4}$"
    status_values:
    - proposed
    - accepted
    - resolved
    - withdrawn
    closed: true
    fields:
      expires: {}
    period:
      from: date
      until: expires
  edit:
    dir: spec/edits
    id: "^he-\\d{4}$"
    status_values:
    - proposed
    - accepted
    - rejected
    - superseded
    - withdrawn
    closed: true
    append_only: true
    fields:
      approval:
        one_of:
        - human
        - auto
        required: true
      approved_by: {}
      component:
        one_of:
        - system-prompt
        - tool-description
        - tool-implementation
        - middleware
        - skill
        - subagent-config
        - memory
        required: true
      diff_sha256: {}
      in_force_from: {}
      in_force_until: {}
      paths: {}
      root_cause: {}
      touches: {}
    period:
      from: in_force_from
      until: in_force_until
  measure:
    dir: spec/measures
    id: "^interp/UZ-[A-Z]-\\d{3}@\\d{4}-\\d{2}-\\d{2}$"
    append_only: true
  pattern:
    dir: spec/patterns
    id: ^fp/[a-z0-9-]+$
    status_values:
    - open
    - resolved
    - withdrawn
    closed: true
    append_only: true
    fields:
      category:
        one_of:
        - not-provided
        - unsafe-provided
        - wrong-timing
        - wrong-duration
        required: true
      component:
        one_of:
        - system-prompt
        - tool-description
        - tool-implementation
        - middleware
        - skill
        - subagent-config
        - memory
        required: true
      context:
        required: true
      evidence: {}
  pm:
    dir: spec/pm
    id: "^pm-\\d{4}$"
    status_values:
    - draft
    - published
  premise:
    dir: spec/premises
    id: ^premise/[a-z0-9/-]+$
    status_values:
    - proposed
    - accepted
    - retired
    - superseded
    fields:
      retired_on: {}
    period:
      from: date
      until: retired_on
  principle:
    dir: spec/principles
    id: ^principle/[a-z0-9/-]+$
    status_values:
    - proposed
    - accepted
    - superseded
    - withdrawn
  run:
    dir: spec/runs
    id: "^run/he-\\d{4}@\\d{4}-\\d{2}-\\d{2}-[a-z0-9.]+(-[a-z0-9.]+)*-(in|out)(-\\d+)?$"
    closed: true
    append_only: true
    fields:
      split:
        one_of:
        - held-in
        - held-out
        required: true
      suite:
        required: true
      trace: {}
      trials: {}
      verdict:
        one_of:
        - improve
        - hold
        - regress
        - inconclusive
        required: true
  topic:
    dir: spec/topics
    id: ^topic/[a-z0-9/-]+$
  verifier:
    dir: spec/verifiers
    id: "^verifier/[a-z0-9][a-z0-9-]{0,63}@\\d{4}-\\d{2}-\\d{2}(-\\d+)?$"
    closed: true
    append_only: true
    fields:
      kill_rate: {}
      mutants: {}
      reference_runs: {}
      report: {}
      verdict:
        one_of:
        - healthy
        - unhealthy
        - inconclusive
        required: true
status_field: status
edges:
- name: supersedes
  key: supersedes
  acyclic: true
  direction: forward
  from:
  - clause
  - premise
  - edit
  to:
  - clause
  - premise
  - edit
  attrs:
    reason:
      required: true
      one_of:
      - recurrence
      - premise-collapse
      - conflict
      - vocabulary
- name: enforces
  key: enforces
  acyclic: false
  direction: forward
  from:
  - conform
  to:
  - clause
  target:
    leaf_of: supersedes
- name: deviates-from
  key: deviates-from
  acyclic: false
  direction: forward
  from:
  - deviation
  to:
  - clause
  target:
    attr:
      status:
        eq: accepted
    leaf_of: supersedes
- name: premise
  key: premise
  acyclic: false
  direction: forward
  from:
  - clause
  - edit
  to:
  - premise
- name: rationale
  key: rationale
  acyclic: false
  direction: forward
  from:
  - clause
  to:
  - principle
- name: counterexample
  key: counterexample
  acyclic: false
  direction: forward
  from:
  - clause
  - principle
  - edit
  to:
  - pm
- name: measures
  key: measures
  acyclic: false
  direction: forward
  from:
  - measure
  to:
  - clause
  attrs:
    agreement:
      required: true
      type: number
    model:
      required: true
      type: string
  target:
    leaf_of: supersedes
- name: about
  key: about
  acyclic: false
  direction: forward
  from:
  - clause
  - edit
  to:
  - topic
  min_outbound: 1
- name: excepts
  key: excepts
  acyclic: true
  direction: forward
  from:
  - clause
  to:
  - clause
  attrs:
    scope:
      required: true
      type: string
- name: interop
  key: interop
  acyclic: false
  direction: forward
  from:
  - clause
  to:
  - clause
- name: predicts
  key: predicts
  acyclic: false
  direction: forward
  from:
  - edit
  to:
  - pattern
  attrs:
    expect:
      required: true
      one_of:
      - fix
      - at-risk
    outcome:
      one_of:
      - confirmed
      - refuted
- name: validates
  key: validates
  acyclic: false
  direction: forward
  from:
  - run
  to:
  - edit
  attrs:
    baseline_pass_rate:
      required: true
      type: number
    model:
      required: true
      type: string
    pass_rate:
      required: true
      type: number
rules:
- name: orphan_must
  severity: error
  when:
    not_inbound: enforces
    any_of:
    - attr:
        modality:
          eq: MUST
        status:
          eq: accepted
    - attr:
        modality:
          eq: MUST_NOT
        status:
          eq: accepted
  message: is MUST or MUST_NOT and accepted but nothing enforces it
- name: orphan_test
  severity: error
  when:
    not_outbound: enforces
    attr:
      kind:
        eq: conform
  message: enforces no clause
- name: stale_premise
  severity: error
  when:
    via:
      edge: premise
      attr:
        in_force:
          eq: "false"
    attr:
      status:
        eq: accepted
  message: is accepted but a premise is no longer in force
- name: deviation_pressure
  severity: warn
  when:
    inbound:
      edge: deviates-from
      min: 5
    attr:
      status:
        eq: accepted
  message: has 5+ deviations; reconsider the clause
- name: no_counterexample
  severity: warn
  when:
    not_outbound: counterexample
    attr:
      kind:
        eq: clause
      status:
        eq: accepted
  message: is accepted without a counterexample
- name: may_without_interop
  severity: warn
  when:
    not_outbound: interop
    attr:
      modality:
        eq: MAY
      status:
        eq: accepted
  message: is MAY but names no MUST clause that guarantees interoperation without it
- name: interop_not_must
  severity: error
  when:
    outbound: interop
    via:
      edge: interop
      attr:
        modality:
          not: MUST
  message: interop must point at a MUST clause
- name: status_drift
  severity: error
  when:
    via_inbound:
      edge: supersedes
      attr:
        in_force:
          eq: "true"
        status:
          eq: accepted
    attr:
      status:
        not: superseded
  message: an in-force successor supersedes it but status is not superseded
- name: pending_successor
  severity: warn
  when:
    inbound: supersedes
    attr:
      status:
        eq: accepted
    not:
      attr:
        has_inforce_successor:
          eq: "true"
  message: a successor is declared but not yet in force; this clause remains binding until then
- name: premature_superseded
  severity: error
  when:
    attr:
      status:
        eq: superseded
    not:
      attr:
        has_inforce_successor:
          eq: "true"
  message: status is superseded but no successor is in force yet
- name: accepted_unvalidated
  severity: error
  when:
    attr:
      kind:
        eq: edit
      status:
        eq: accepted
    any_of:
    - attr:
        validated_in:
          eq: "false"
    - attr:
        validated_out:
          eq: "false"
    - attr:
        improved:
          eq: "false"
  message: is accepted without a non-regressing held-in run, a non-regressing held-out run and a strict improvement
- name: edit_touches_readonly
  severity: error
  when:
    attr:
      kind:
        eq: edit
    not:
      attr:
        touches:
          subset_of:
          - system-prompt
          - tool-description
          - tool-implementation
          - middleware
          - skill
          - subagent-config
          - memory
  message: "must list touches: within the seven harness surfaces; verifier, tracer and model-config are read-only"
- name: edit_without_prediction
  severity: error
  when:
    not_outbound: predicts
    attr:
      in_force:
        eq: "true"
      kind:
        eq: edit
  message: "predicts nothing; declare predicts: with expect: fix or at-risk"
- name: rejected_without_run
  severity: error
  when:
    not_inbound: validates
    attr:
      kind:
        eq: edit
      status:
        eq: rejected
  message: was rejected with no run recorded; a rejection is kept with its evidence
- name: propose_only_accepted
  severity: error
  when:
    attr:
      kind:
        eq: edit
      status:
        eq: accepted
    any_of:
    - attr:
        component:
          eq: tool-implementation
  message: edits a propose-only surface and cannot be accepted
- name: accepted_without_approver
  severity: error
  when:
    attr:
      approval:
        eq: auto
      kind:
        eq: edit
      status:
        eq: accepted
    any_of:
    - attr:
        component:
          eq: system-prompt
    - attr:
        component:
          eq: tool-description
    - attr:
        component:
          eq: middleware
    - attr:
        component:
          eq: subagent-config
  message: "edits a human-approval surface but was accepted without a person; set approval: human and name the approver in approved_by"
- name: pattern_resolved_unfixed
  severity: warn
  when:
    attr:
      kind:
        eq: pattern
      status:
        eq: resolved
    not:
      via_inbound:
        edge: predicts
        attr:
          status:
            eq: accepted
  message: is resolved but no accepted edit predicted it
- name: predicts_withdrawn
  severity: warn
  when:
    via:
      edge: predicts
      attr:
        status:
          eq: withdrawn
    attr:
      kind:
        eq: edit
    any_of:
    - attr:
        status:
          eq: proposed
    - attr:
        status:
          eq: accepted
  message: predicts a withdrawn pattern
- name: edit_without_topic
  severity: error
  when:
    not_outbound: about
    attr:
      in_force:
        eq: "true"
      kind:
        eq: edit
  message: names no topic; every edit states the subject it is about
projections:
- name: enforced
  when:
    inbound: enforces
- name: has_inforce_successor
  when:
    via_inbound:
      edge: supersedes
      attr:
        in_force:
          eq: "true"
        status:
          eq: accepted
- name: effective_must
  any_of:
  - when:
      inbound: enforces
      attr:
        in_force:
          eq: "true"
        modality:
          eq: MUST
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
  - when:
      inbound: enforces
      attr:
        in_force:
          eq: "true"
        modality:
          eq: MUST_NOT
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
- name: effective_should
  any_of:
  - when:
      attr:
        in_force:
          eq: "true"
        modality:
          eq: SHOULD
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
  - when:
      attr:
        in_force:
          eq: "true"
        modality:
          eq: SHOULD_NOT
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
  - when:
      not_inbound: enforces
      attr:
        in_force:
          eq: "true"
        modality:
          eq: MUST
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
  - when:
      not_inbound: enforces
      attr:
        in_force:
          eq: "true"
        modality:
          eq: MUST_NOT
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
- name: effective
  any_of:
  - when:
      attr:
        effective_must:
          eq: "true"
  - when:
      attr:
        effective_should:
          eq: "true"
  - when:
      attr:
        in_force:
          eq: "true"
        modality:
          eq: MAY
        status:
          eq: accepted
      not:
        attr:
          has_inforce_successor:
            eq: "true"
  - when:
      attr:
        in_force:
          eq: "true"
        kind:
          eq: calibration
  - when:
      attr:
        improved:
          eq: "true"
        in_force:
          eq: "true"
        kind:
          eq: edit
        status:
          eq: accepted
        validated_in:
          eq: "true"
        validated_out:
          eq: "true"
      not:
        attr:
          has_inforce_successor:
            eq: "true"
- name: validated_in
  any_of:
  - when:
      via_inbound:
        edge: validates
        attr:
          split:
            eq: held-in
          verdict:
            eq: improve
  - when:
      via_inbound:
        edge: validates
        attr:
          split:
            eq: held-in
          verdict:
            eq: hold
- name: validated_out
  any_of:
  - when:
      via_inbound:
        edge: validates
        attr:
          split:
            eq: held-out
          verdict:
            eq: improve
  - when:
      via_inbound:
        edge: validates
        attr:
          split:
            eq: held-out
          verdict:
            eq: hold
- name: improved
  when:
    via_inbound:
      edge: validates
      attr:
        verdict:
          eq: improve
binding: effective
references:
  dangling: error
  pattern: "^(UZ-[A-Z]-\\d{3}|conform/[a-z0-9-]+|dev-\\d{4}|interp/.+|premise/.+|principle/.+|pm-\\d{4}|topic/.+|he-\\d{4}|fp/[a-z0-9-]+|run/he-\\d{4}@\\d{4}-\\d{2}-\\d{2}-[a-z0-9.]+(-[a-z0-9.]+)*-(in|out)(-\\d+)?|verifier/[a-z0-9][a-z0-9-]{0,63}@\\d{4}-\\d{2}-\\d{2}(-\\d+)?|calibration/[a-z0-9.]+(-[a-z0-9.]+)*@\\d{4}-\\d{2}-\\d{2}(-\\d+)?)$"
  scan:
  - body
  - frontmatter
structural:
  missing_frontmatter: error
